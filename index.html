<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="696 DEPT - Simple. Bold. Culture. Streetwear that speaks.">
    <title>696 DEPT | Streetwear</title>
    
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #111111;
        }
        
        /* Navigation */
        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 1rem 2rem;
            border-bottom: 1px solid #eaeaea;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .container-fluid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .left-section {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .navbar-brand {
            display: inline-block;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #111111 !important;
            border: 2px solid #111111;
            padding: 6px 16px;
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        
        .nav-link {
            color: #111111 !important;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 0.5rem 1rem !important;
            transition: color 0.3s ease;
            text-decoration: none;
        }
        
        .nav-link:hover {
            color: #888888 !important;
        }
        
        .right-icons {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .search-btn-header {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 12px;
        }
        
        .cart-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .cart-icon {
            font-size: 1.2rem;
            color: #111111;
            text-decoration: none;
            padding: 8px 12px;
        }
        
        .cart-count {
            position: absolute;
            top: 0px;
            right: 4px;
            background-color: #111111;
            color: #ffffff;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        
        .navbar-toggler {
            display: none;
            border: none;
            background: transparent;
            font-size: 1.5rem;
        }
        
        /* Search Modal */
        .search-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        .search-modal.active {
            display: flex;
        }
        
        .search-modal-content {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        
        .search-modal-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: none;
            border-bottom: 2px solid #ffffff;
            background: transparent;
            color: white;
            outline: none;
            text-align: center;
        }
        
        .search-modal-input::placeholder {
            color: #888888;
        }
        
        .close-search {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
        
.hero {
    min-height: 100vh;
    width: 100%;
    background-image: url('images/hero-bg.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    /* High Resolution Fixes */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 2rem 0 8rem;
}
        
        /* Dark overlay gradient - REMOVED to make text black */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            text-align: left;
            animation: fadeInLeft 0.8s ease;
        }
        
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .hero h1 {
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            color: #111111;
            line-height: 1.2;
            text-shadow: none;
            text-align: left;
        }
        
        .hero .tagline {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #555555;
            margin-bottom: 2rem;
            font-weight: 500;
            text-shadow: none;
            text-align: left;
        }
        
        .btn-shop {
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 14px 45px;
            font-size: 0.85rem;
            letter-spacing: 3px;
            font-weight: 700;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        
        .btn-shop:hover {
            background-color: #333333;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* Featured Section */
        .featured-section {
            padding: 5rem 2rem 6rem;
            background-color: #ffffff;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .section-title h2 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: #111111;
        }
        
        .product-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .product-card {
            flex: 1;
            min-width: 200px;
            max-width: 250px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
        }
        
        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f5f5f5;
            overflow: hidden;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #111111;
            margin-bottom: 0.3rem;
        }
        
        /* Footer */
        .footer {
            background-color: #111111;
            padding: 2rem 2rem 1.5rem;
            margin-top: 0;
        }
        
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .footer-logo {
            display: inline-block;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff !important;
            border: 1px solid #ffffff;
            padding: 4px 12px;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        
        .footer-links a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        
        .footer-links a:hover {
            color: #ffffff;
        }
        
        .footer-copyright p {
            color: #666666;
            font-size: 0.6rem;
            letter-spacing: 1px;
            margin: 0;
        }
        
        /* ========== RESPONSIVE STYLES ========== */
        @media (max-width: 992px) {
            .navbar {
                position: relative;
                background-color: #ffffff;
            }
            
            .navbar-toggler {
                display: block;
                order: 2;
            }
            
            .right-icons {
                order: 1;
            }
            
            .left-section {
                order: 0;
                flex: 1;
            }
            
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 1rem;
            }
            
            .nav-links.show {
                display: flex;
            }
            
            .nav-link {
                padding: 0.8rem !important;
                border-bottom: 1px solid #eeeeee;
                text-align: center;
                display: block;
            }
            
            .hero {
                justify-content: center;
                padding: 0 2rem;
                background-attachment: scroll;
            }
            
            .hero-content {
                text-align: center;
                max-width: 90%;
            }
            
            .hero h1 {
                text-align: center;
                font-size: 3rem;
            }
            
            .hero .tagline {
                text-align: center;
                font-size: 0.9rem;
            }
            
            .hero h1 br {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 0.8rem 1rem;
            }
            
            .navbar-brand {
                font-size: 1rem;
                padding: 4px 12px;
            }
            
            .hero {
                padding: 0 1.5rem;
            }
            
            .hero h1 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            
            .hero .tagline {
                font-size: 0.7rem;
                letter-spacing: 2px;
            }
            
            .btn-shop {
                padding: 10px 30px;
                font-size: 0.7rem;
            }
            
            .product-grid {
                gap: 1rem;
            }
            
            .product-card {
                min-width: 160px;
            }
            
            .footer {
                padding: 1.5rem 1rem 1rem;
            }
            
            .footer-links {
                gap: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .navbar-brand {
                font-size: 0.85rem;
                padding: 3px 10px;
            }
            
            .hero h1 {
                font-size: 1.8rem;
            }
            
            .product-card {
                min-width: 140px;
            }
            
            .product-title {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

 
<nav class="navbar">
    <div class="container-fluid">
        <div class="left-section">
            <a class="navbar-brand" href="index.html">696 DEPT</a>
            <div class="nav-links" id="navLinks">
                <a class="nav-link" href="index.html">HOME</a>
                <a class="nav-link" href="shop.html">SHOP</a>
                <a class="nav-link" href="about.html">ABOUT</a>
                <a class="nav-link" href="contact.html">CONTACT</a>
            </div>
        </div>
        <div class="right-icons">
            <button class="search-btn-header" onclick="openSearchModal()"><i class="fas fa-search"></i></button>
            <div class="cart-wrapper">
                <a href="cart.html" class="cart-icon"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></a>
            </div>
        </div>
        <button class="navbar-toggler" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
    </div>
</nav>

 
<div id="searchModal" class="search-modal">
    <span class="close-search" onclick="closeSearchModal()">&times;</span>
    <div class="search-modal-content">
        <input type="text" id="searchInput" class="search-modal-input" placeholder="Search products...">
        <button onclick="performSearch()" style="margin-top: 20px; background: white; border: none; padding: 10px 30px; cursor: pointer; font-weight: 600;">SEARCH</button>
    </div>
</div>

 
<section class="hero">
    <div class="hero-content">
        <h1>SIMPLE.<br>BOLD.<br>CULTURE.</h1>
        <div class="tagline">Streetwear that speaks.</div>
        <a href="shop.html" class="btn-shop">SHOP NOW</a>
    </div>
</section>

 
<section class="featured-section">
    <div class="section-title">
        <h2>FEATURED T-SHIRTS</h2>
    </div>
    <div class="product-grid" id="featuredProducts">
        <div class="product-card" onclick="viewProduct(1)">
            <div class="product-image">
                <img src="images/White 696.jpg" alt="F33 T-Shirt">
            </div>
            <div class="product-title">P299</div>
        </div>
        <div class="product-card" onclick="viewProduct(2)">
            <div class="product-image">
                <img src="images/home tshirt 2.jpg" alt="F36 T-Shirt">
            </div>
            <div class="product-title">P299</div>
        </div>
        <div class="product-card" onclick="viewProduct(3)">
            <div class="product-image">
                <img src="images/home tshirt 3.jpg" alt="F38 T-Shirt">
            </div>
            <div class="product-title">P299</div>
        </div>
        <div class="product-card" onclick="viewProduct(4)">
            <div class="product-image">
                <img src="images/home tshirts.jpg" alt="F39 T-Shirt">
            </div>
            <div class="product-title">P299</div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="footer-container">
        <div class="footer-brand">
            <a href="index.html" class="footer-logo">696 DEPT</a>
        </div>
        <div class="footer-links">
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </div>
        <div class="footer-copyright">
             <p>© 2025 696 DEPT — BUILT FROM NOTHING</p>
        </div>
    </div>
</footer>

<script>
    // Product database mapping for homepage featured products
    const featuredProductsMap = {
        4: { id: 4, name: "Worldwide Tee", price: 299, image: "images/White 696.jpg" },
        8: { id: 8, name: "Street Code", price: 299, image: "images/home tshirt 2.jpg" },
        2: { id: 2, name: "Classic 696 Tee", price: 299, image: "images/home tshirt 3.jpg" },
        1: { id: 1, name: "Spalter 696 Tee", price: 299, image: "images/home tshirts.jpg" }
    };
    
    function viewProduct(id) {
        // Redirect to product page with the correct product ID
        window.location.href = `product.html?id=${id}`;
    }
    
    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const elem = document.getElementById('cartCount');
        if (elem) elem.innerText = totalItems;
    }
    
    function toggleMobileMenu() {
        const navLinks = document.getElementById('navLinks');
        navLinks.classList.toggle('show');
    }
    
    function openSearchModal() {
        document.getElementById('searchModal').classList.add('active');
        setTimeout(() => { document.getElementById('searchInput').focus(); }, 100);
    }
    
    function closeSearchModal() {
        document.getElementById('searchModal').classList.remove('active');
    }
    
    function performSearch() {
        const term = document.getElementById('searchInput').value.trim();
        if (term) window.location.href = `shop.html?search=${encodeURIComponent(term)}`;
        closeSearchModal();
    }
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSearchModal();
    });
    
    document.addEventListener('DOMContentLoaded', function() {
        updateCartCount();
    });
</script>
     <script src="js/script.js"></script>
</body>
</html>
