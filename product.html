            sizes: ["S","M","L","XL"], 
            colors: ["white"]
        },
    };
    
    
    const colorNames = { 
        black: 'Black', 
        white: 'White', 
        gray: 'Gray', 
        brown: 'Brown'
    };
    
     
    function getProductId() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id'));
    }
    
    let currentProduct = null;
    let selectedSize = "M";
    let selectedColor = null;
    let currentQuantity = 1;
    
     
    function loadProduct() {
        const id = getProductId();
        currentProduct = products[id];
        
         
        if (!currentProduct) {
            window.location.href = 'shop.html';
            return;
        }
        
         
        selectedColor = currentProduct.colors[0];
        
      
        document.getElementById('breadcrumbProduct').innerText = currentProduct.name;
        
        
        document.getElementById('productName').innerText = currentProduct.name;
        document.getElementById('productPrice').innerText = `P${currentProduct.price}`;
        document.getElementById('productShortDesc').innerHTML = currentProduct.shortDesc;
        document.getElementById('productLongDesc').innerHTML = currentProduct.longDesc;
        document.getElementById('productImage').innerHTML = `<img src="${currentProduct.image}" alt="${currentProduct.name}" onerror="this.src='https://via.placeholder.com/600?text=Image+Not+Found'">`;
        
        
        if (currentProduct.sizes.includes("M")) {
            selectedSize = "M";
        } else {
            selectedSize = currentProduct.sizes[0];
        }
        
        
        const sizeContainer = document.getElementById('sizeOptions');
        sizeContainer.innerHTML = '';
        currentProduct.sizes.forEach(size => {
            const btn = document.createElement('button');
            btn.className = 'size-btn';
            btn.innerText = size;
            btn.onclick = () => selectSize(size);
            if (size === selectedSize) btn.classList.add('active');
            sizeContainer.appendChild(btn);
        });
        
        // Update color options
        const colorContainer = document.getElementById('colorOptions');
        colorContainer.innerHTML = '';
        currentProduct.colors.forEach(color => {
            const option = document.createElement('div');
            option.className = 'color-option';
            if (color === selectedColor) option.classList.add('active');
            option.setAttribute('data-color', color);
            option.innerHTML = `
                <div class="color-circle-small color-${color}"></div>
                <span>${colorNames[color] || color}</span>
            `;
            option.onclick = () => selectColor(color);
            colorContainer.appendChild(option);
        });
    }
    
    function selectSize(size) {
        selectedSize = size;
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === size) btn.classList.add('active');
        });
    }
    
    function selectColor(color) {
        selectedColor = color;
        document.querySelectorAll('.color-option').forEach(opt => {
            opt.classList.remove('active');
            if (opt.getAttribute('data-color') === color) opt.classList.add('active');
        });
    }
    
    function changeQuantity(delta) {
        currentQuantity += delta;
        if (currentQuantity < 1) currentQuantity = 1;
        document.getElementById('quantity').value = currentQuantity;
    }
    
    function addToCart() {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const existingItem = cart.find(item => 
            item.id === currentProduct.id && item.size === selectedSize && item.color === selectedColor
        );
        
        if (existingItem) {
            existingItem.quantity += currentQuantity;
            showToast(`${currentProduct.name} (${selectedSize}, ${selectedColor}) - Quantity: ${existingItem.quantity}`);
        } else {
            cart.push({
                id: currentProduct.id,
                name: currentProduct.name,
                price: currentProduct.price,
                size: selectedSize,
                color: selectedColor,
                quantity: currentQuantity,
                image: currentProduct.image
            });
            showToast(`${currentProduct.name} (${selectedSize}, ${selectedColor}) added to cart!`);
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
    }
    
    function buyNow() {
        addToCart();
        setTimeout(() => {
            window.location.href = 'checkout.html';
        }, 500);
    }
    
    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const elem = document.getElementById('cartCount');
        if (elem) elem.innerText = totalItems;
    }
    
    function toggleMobileMenu() {
        document.getElementById('navLinks').classList.toggle('show');
    }
    
    function openSearchModal() {
        document.getElementById('searchModal').classList.add('active');
        setTimeout(() => { document.getElementById('searchInput').focus(); }, 100);
    }
    
    function closeSearchModal() {
        document.getElementById('searchModal').classList.remove('active');
    }
    
    function performSearch() {
        const term = document.getElementById('searchInput').value.trim();
        if (term) window.location.href = `shop.html?search=${encodeURIComponent(term)}`;
        closeSearchModal();
    }
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSearchModal();
    });
    
    document.addEventListener('DOMContentLoaded', function() {
        loadProduct();
        updateCartCount();
    });
</script>
</body>
</html>
